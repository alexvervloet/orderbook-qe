# The searching work: deep property runs, mutation, load and chaos. Allowed to
# be slow, allowed to find nothing. See docs/CI-POLICY.md.

name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deep-properties:
    name: deep property and consistency runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: npm ci
      - run: forge build
        working-directory: sut/contracts
      - name: properties at depth
        env:
          PROPERTY_RUNS: 20000
          # A failing session is shrunk and appended to qe/corpus/. The step
          # below turns it into an issue, so a person reads it before it
          # becomes a permanent test. See qe/framework/corpus.ts.
          SAVE_COUNTEREXAMPLES: "1"
        run: npm run test:property
      - name: open an issue for any new counterexample
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- qe/corpus/counterexamples.json && exit 0
          {
            echo "The nightly property run found a failing session and shrank it."
            echo "Replay it, find the cause, then commit the entry below to qe/corpus/counterexamples.json"
            echo "with a real summary and reference, so it runs on every pull request from then on."
            echo
            echo '```diff'
            git diff -- qe/corpus/counterexamples.json
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue.md
          gh issue create --title "Nightly property counterexample $(date -u +%Y-%m-%d)" --body-file issue.md
      - name: consistency at depth
        env:
          CONSISTENCY_RUNS: 40
        run: npm run test:consistency
      - name: solidity invariants at depth
        env:
          FOUNDRY_PROFILE: nightly
        run: forge test --match-contract Invariant
        working-directory: sut/contracts

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: npm ci
      - run: forge build
        working-directory: sut/contracts
      # Reported, never gated. A mutation score that blocks a merge becomes a
      # number people optimise. See docs/NON-GOALS.md.
      - run: npm run mutate
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: qe/mutation/reports/

  flake:
    name: flake detection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: npm ci
      - run: forge build
        working-directory: sut/contracts
      # Ten identical runs. Anything not unanimous is flaky and gets one working
      # day to be fixed or deleted. See docs/CI-POLICY.md.
      - run: npm run flake:detect

  chaos:
    name: reorg and fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: npm ci
      - run: forge build
        working-directory: sut/contracts
      # The network tests skip without Toxiproxy, which is right on a laptop
      # and wrong here. The first version of this job never started it, so it
      # would have skipped all five every night and stayed green.
      - name: start the backend behind Toxiproxy
        run: docker compose --profile chaos up -d --build --wait
      - name: chaos suite
        env:
          REQUIRE_TOXIPROXY: "1"
        run: npm run test:chaos
      - name: stop the chaos profile
        if: always()
        run: docker compose --profile chaos down

  performance:
    name: load, stress and latency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: start the exchange
        run: docker compose up -d --build --wait backend
      # handleSummary writes here, and k6 does not create directories. The
      # directory is gitignored, so it does not exist on a fresh checkout.
      - run: mkdir -p qe/suites/perf/results
      - name: load
        run: k6 run qe/suites/perf/load.js
      - name: stress
        run: k6 run qe/suites/perf/stress.js
      - name: latency
        run: k6 run qe/suites/perf/latency.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: qe/suites/perf/results/
